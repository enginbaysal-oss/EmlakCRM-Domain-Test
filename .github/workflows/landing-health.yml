name: Verify published EmlakCRM landing (read-only)
on:
  push:
    paths:
      - ".github/workflows/landing-health.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm HTTPS, actual landing content, and existing app
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            echo "Check attempt ${attempt}"
            headers="$(mktemp)"
            page="$(mktemp)"
            if curl --fail --silent --show-error --location --max-time 12 --dump-header "$headers" "https://emlkcrm.com.tr/?build=1d779919" -o "$page" &&
               grep -q "Emlak işlerinizi" "$page" &&
               grep -q 'https://enginbaysal-oss.github.io/EmlakCRM-Web/index.html#account' "$page" &&
               ! grep -Eq '<form|<input|supabase.co' "$page"; then
              echo "LANDING_OK: valid HTTPS and new EmlakCRM landing content"
              grep -iE '^HTTP/|^content-type:|^location:' "$headers" || true
              break
            fi
            if [ "$attempt" -eq 6 ]; then echo "LANDING_NOT_READY"; exit 1; fi
            sleep 8
          done
          curl --fail --silent --show-error --location --output /dev/null --max-time 15 "https://enginbaysal-oss.github.io/EmlakCRM-Web/index.html"
          echo "PRODUCTION_APP_OK: existing EmlakCRM GitHub page remains available"
